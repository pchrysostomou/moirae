name: pages

# Deploys the studio to GitHub Pages with the example traces beside it, so
# the seed-19 demo opens in a browser with nothing installed:
#   https://pchrysostomou.github.io/moirae/?trace=clean-partition.jsonl
# Settings > Pages > Build and deployment > Source must be "GitHub Actions";
# until it is, the deploy job fails with "Failed to create deployment".
# There is no configure-pages step: the base path is set at build time
# (apps/studio/vite.config.ts), and the only thing that action would do
# here is read the site settings, which 404s before Pages is enabled.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The token is read-only by default. Write permissions live on the one job
# that needs them (SonarCloud S8233); a job's own block replaces this one.
permissions:
  contents: read

# One deploy at a time. A newer push supersedes a queued one; a deploy already
# in flight is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      # Regenerates the example traces into out/ and asserts their pinned
      # hashes, so the hosted trace is the one CI vouches for.
      - run: pnpm examples
      # --mode pages sets base to /moirae/ (apps/studio/vite.config.ts).
      - run: pnpm --filter @moirae/studio build:pages
      # The traces sit next to index.html, so ?trace=clean-partition.jsonl
      # resolves to /moirae/clean-partition.jsonl.
      - run: cp out/*.jsonl apps/studio/dist/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/studio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write # create the Pages deployment
      id-token: write # the OIDC token that proves where the deployment came from
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
